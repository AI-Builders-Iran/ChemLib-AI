[theme]
base = "light"
primaryColor = "#0E7C86"
backgroundColor = "#F6F8F7"
secondaryBackgroundColor = "#EEF2F1"
textColor = "#14263A"
font = "sans serif"

[client]
# Hides developer-only menu items so the app looks clean in front of a client.
toolbarMode = "minimal"

[server]
# Library books are large; the default limit is 200 MB per file.
maxUploadSize = 500

[browser]
gatherUsageStats = false